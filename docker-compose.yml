# Uso:
#   cp .env.example .env      # y rellena POSTGRES_PASSWORD
#   docker compose up --build
#   docker compose exec app python generate_data.py     # datos de demo (borra los existentes)
#   docker compose exec app python -m app.ai.trainer    # entrena el modelo
#
# El dashboard queda en http://localhost:8000
# Sin entrenar el modelo, el dashboard carga pero las predicciones devuelven 503.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-stockwise}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stockwise}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stockwise}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # El modelo entrenado (.pkl) no se versiona: lo guardamos en un volumen
      - models:/app/app/ai/model_store

volumes:
  pgdata:
  models:
